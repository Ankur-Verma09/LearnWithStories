[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-story-tutor"
version = "0.2.0"
description = "Offline-first grounded storytelling tutor for Indian government exam preparation"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
story-tutor = "story_tutor.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
